<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070a1f">
  <title>Pakohuone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --night: #070a1f;
      --blue: #6fa8ff;
      --blue-soft: #bcd4ff;
      --wine: #8c1d47;
      --wine-deep: #4a0e27;
      --rose: #ff8fb4;
      --cream: #f1e6d8;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh;
      font-family: 'Cinzel';
      color: var(--cream);
      background: linear-gradient(180deg, #04061a 0%, #0b1a46 40%, #3a0c26 85%, #2a0a1c 100%);
      display: flex; align-items: center; justify-content: center;
      padding: 20px 16px;
      overflow-x: hidden;
    }

    /* ---------- TAUSTA ---------- */
    .bg { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }

    .aurora {
      position: absolute; width: 140%; height: 45%; left: -20%; top: -5%;
      filter: blur(60px); opacity: .55;
      background:
        radial-gradient(ellipse at 25% 50%, rgba(80,140,255,.8), transparent 60%),
        radial-gradient(ellipse at 65% 40%, rgba(150,30,90,.7), transparent 60%),
        radial-gradient(ellipse at 90% 60%, rgba(60,110,230,.6), transparent 55%);
      animation: aurora 18s ease-in-out infinite alternate;
    }
    @keyframes aurora {
      from { transform: translateX(-4%) scaleY(1); }
      to   { transform: translateX(4%) scaleY(1.25); }
    }

    .moon {
      position: absolute; top: 6%; right: 10%;
      width: clamp(80px, 22vw, 130px); aspect-ratio: 1; border-radius: 50%;
      background:
        radial-gradient(circle at 30% 30%, #fffdf5 0%, #d6e2ff 40%, #86a8f0 100%);
      box-shadow: 0 0 40px 10px rgba(130,170,255,.55), 0 0 140px 50px rgba(90,130,255,.3);
      animation: pulse 7s ease-in-out infinite;
    }
    .moon::before, .moon::after {
      content: ""; position: absolute; border-radius: 50%; background: rgba(90,120,190,.28);
    }
    .moon::before { width: 22%; height: 22%; left: 56%; top: 24%; }
    .moon::after  { width: 14%; height: 14%; left: 28%; top: 58%; }
    @keyframes pulse { 50% { box-shadow: 0 0 55px 14px rgba(130,170,255,.7), 0 0 170px 60px rgba(90,130,255,.38); } }

    .star {
      position: absolute; border-radius: 50%; background: #dce8ff;
      animation: twinkle 3.5s infinite ease-in-out;
    }
    @keyframes twinkle { 0%,100% { opacity: .15; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.2); } }

    .scene { position: absolute; bottom: 0; left: 0; width: 100%; height: 48vh; }
    .window { animation: flicker 4s infinite; }
    @keyframes flicker { 0%,100% { opacity: 1; } 45% { opacity: .55; } 60% { opacity: .9; } }

    .fog {
      position: absolute; left: -50%; width: 200%; height: 22vh; bottom: 2vh;
      background: radial-gradient(ellipse at center, rgba(140,160,230,.22), transparent 70%);
      animation: fog 30s linear infinite alternate;
    }
    .fog.two { bottom: 10vh; opacity: .7; animation-duration: 42s; animation-direction: alternate-reverse; }
    @keyframes fog { from { transform: translateX(-12%); } to { transform: translateX(12%); } }

    .wisp {
      position: absolute; border-radius: 50%; opacity: 0;
      animation: rise linear infinite;
    }
    .wisp.blue { background: var(--blue); box-shadow: 0 0 12px 4px rgba(111,168,255,.85); }
    .wisp.red  { background: var(--rose); box-shadow: 0 0 12px 4px rgba(200,50,100,.85); }
    @keyframes rise {
      0%   { transform: translate(0,0); opacity: 0; }
      15%  { opacity: .95; }
      85%  { opacity: .8; }
      100% { transform: translate(var(--dx), -55vh); opacity: 0; }
    }

    /* ---------- KORTTI ---------- */
    .card {
      position: relative; z-index: 2;
      width: 100%; max-width: 430px;
      padding: 44px 28px 34px;
      text-align: center;
      background: linear-gradient(160deg, rgba(25,12,40,.78), rgba(12,8,32,.78));
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(111,168,255,.35);
      border-radius: 20px;
      box-shadow:
        0 0 0 6px rgba(7,10,31,.55),
        0 0 0 7px rgba(140,29,71,.7),
        0 0 60px rgba(140,29,71,.55),
        0 0 40px rgba(80,140,255,.2) inset;
    }
    .card::before, .card::after {
      content: "❖"; position: absolute; top: -17px; left: 50%; transform: translateX(-50%);
      font-size: 1.5rem; color: var(--blue);
      background: #0a0a24; padding: 0 12px; line-height: 1;
      text-shadow: 0 0 14px var(--blue);
    }
    .card::after { top: auto; bottom: -17px; color: var(--rose); text-shadow: 0 0 14px #c8326a; }

    h1 {
      font-family: 'Cinzel Decorative';
      font-size: clamp(1.5rem, 7vw, 2rem);
      margin: 0 0 6px; letter-spacing: .06em; font-weight: 700;
      background: linear-gradient(180deg, #ffffff, var(--blue-soft) 55%, #7fa6f0);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 14px rgba(111,168,255,.6));
    }
    .sub { margin: 0; color: #e0a9bd; font-size: .9rem; letter-spacing: .14em; text-transform: uppercase; }

    .divider {
      display: flex; align-items: center; gap: 12px; margin: 22px 0 26px;
      color: var(--blue); font-size: .8rem;
    }
    .divider::before, .divider::after {
      content: ""; flex: 1; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(111,168,255,.7), transparent);
    }

    input {
      font-family: inherit; font-weight: 600;
      width: 100%; font-size: 2rem; text-align: center; letter-spacing: .4em;
      padding: 14px 8px 14px 20px; border-radius: 14px;
      background: rgba(4,6,26,.75); color: var(--cream);
      border: 1px solid rgba(192,74,115,.7);
      outline: none; transition: .25s;
    }
    input::placeholder { color: rgba(188,212,255,.3); }
    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(111,168,255,.2), 0 0 26px rgba(111,168,255,.5);
    }

    button {
      font-family: inherit; font-weight: 700; letter-spacing: .25em; font-size: 1.05rem;
      position: relative; overflow: hidden;
      width: 100%; margin-top: 18px; padding: 16px;
      color: var(--cream); cursor: pointer; border-radius: 14px;
      border: 1px solid #d2587f;
      background: linear-gradient(180deg, var(--wine), var(--wine-deep));
      box-shadow: 0 0 24px rgba(140,29,71,.7), inset 0 1px 0 rgba(255,255,255,.18);
      transition: transform .15s, box-shadow .25s;
    }
    button::after {
      content: ""; position: absolute; top: 0; left: -80%; width: 50%; height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,.28), transparent);
      transform: skewX(-20deg); animation: shine 4.5s infinite;
    }
    @keyframes shine { 0%, 60% { left: -80%; } 100% { left: 160%; } }
    button:hover { box-shadow: 0 0 34px rgba(200,50,100,.9), inset 0 1px 0 rgba(255,255,255,.18); }
    button:active { transform: scale(.97); }

    #msg { min-height: 1.6em; margin-top: 16px; color: var(--rose); font-size: .95rem; letter-spacing: .05em; }
    .shake { animation: shake .45s; }
    @keyframes shake {
      20% { transform: translateX(-10px); } 40% { transform: translateX(9px); }
      60% { transform: translateX(-6px); } 80% { transform: translateX(4px); }
    }
    .shake input { border-color: #ff5b8a; box-shadow: 0 0 26px rgba(255,70,120,.6); }

    /* ---------- PALKINTO ---------- */
    #prize { display: none; padding-top: 50px; }
    #prize.show { display: block; animation: reveal 1.6s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes reveal {
      0%   { opacity: 0; transform: scale(.8); filter: blur(12px); }
      100% { opacity: 1; transform: none; filter: none; }
    }
    .portal {
      width: 92px; height: 92px; margin: 0 auto 18px; border-radius: 50%;
      background: radial-gradient(circle, #fff 0%, var(--blue) 30%, var(--wine) 65%, transparent 72%);
      box-shadow: 0 0 40px 12px rgba(111,168,255,.7), 0 0 90px 30px rgba(140,29,71,.6);
      animation: spin 6s linear infinite, glow 2.4s ease-in-out infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes glow { 50% { box-shadow: 0 0 56px 18px rgba(111,168,255,.9), 0 0 110px 40px rgba(180,40,95,.75); } }
    #prize h2 {
      font-family: 'Cinzel Decorative'; font-size: clamp(1.4rem, 6.5vw, 1.9rem);
      margin: 0 0 10px; line-height: 1.3; color: var(--blue-soft);
      text-shadow: 0 0 20px rgba(111,168,255,.8);
    }
    #prize p {
      margin: 0; font-size: 1.3rem; line-height: 1.6; color: var(--cream);
      text-shadow: 0 0 14px rgba(210,88,127,.7);
    }
  </style>
</head>
<body>

  <div class="bg" id="bg">
    <div class="aurora"></div>
    <div class="moon"></div>

    <svg class="scene" viewBox="0 0 800 300" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
      <!-- kaukaiset vuoret -->
      <path d="M0,300 L0,150 L90,80 L180,140 L290,40 L400,150 L500,90 L610,160 L710,70 L800,130 L800,300 Z" fill="#241049" opacity=".9"/>
      <!-- linna -->
      <g fill="#14092b">
        <rect x="560" y="82" width="60" height="62"/>
        <rect x="552" y="70" width="14" height="74"/>
        <rect x="614" y="70" width="14" height="74"/>
        <polygon points="549,70 559,50 569,70"/>
        <polygon points="611,70 621,50 631,70"/>
        <rect x="578" y="58" width="24" height="88"/>
        <polygon points="574,58 590,28 606,58"/>
        <rect x="589" y="14" width="2" height="16"/>
      </g>
      <g class="window" fill="#ffb86b">
        <rect x="587" y="72" width="6" height="10" rx="3"/>
        <rect x="563" y="100" width="5" height="8" rx="2.5"/>
        <rect x="606" y="102" width="5" height="8" rx="2.5"/>
      </g>
      <!-- keskivuoret -->
      <path d="M0,300 L0,205 L100,140 L200,210 L310,125 L430,215 L540,145 L670,225 L800,160 L800,300 Z" fill="#4a0e27"/>
      <!-- etuvuoret -->
      <path d="M0,300 L0,255 L120,205 L250,262 L390,210 L520,268 L650,215 L800,262 L800,300 Z" fill="#12071b"/>
      <!-- puiden siluetit -->
      <g fill="#0b0414">
        <polygon points="40,262 52,200 64,262"/><polygon points="48,262 58,215 68,262"/>
        <polygon points="740,266 752,205 764,266"/><polygon points="750,266 760,218 770,266"/>
        <polygon points="300,268 310,225 320,268"/>
      </g>
    </svg>

    <div class="fog"></div>
    <div class="fog two"></div>
  </div>

  <div class="card" id="lock">
    <h1>Portti</h1>
    <p class="sub">Vain oikea koodi avaa tien</p>
    <div class="divider">✦</div>
    <input id="code" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="·····" aria-label="Koodi">
    <button id="go">AVAA</button>
    <div id="msg"></div>
  </div>

  <div class="card" id="prize">
    <div class="portal"></div>
    <h2>Paljon onnea Kapteeni!</h2>
    <div class="divider">✦</div>
    <p>Saat korttisi Päleltä :)</p>
  </div>

  <script>
    const CODE = "51000";

    // tähdet
    const bg = document.getElementById("bg");
    for (let i = 0; i < 90; i++) {
      const s = document.createElement("div");
      const size = Math.random() * 2 + 1;
      s.className = "star";
      s.style.cssText =
        `left:${Math.random()*100}%;top:${Math.random()*55}%;width:${size}px;height:${size}px;` +
        `animation-delay:${Math.random()*4}s;animation-duration:${2.5+Math.random()*3}s`;
      bg.appendChild(s);
    }
    // leijuvat valot ja kipinät
    for (let i = 0; i < 26; i++) {
      const w = document.createElement("div");
      const size = 3 + Math.random() * 4;
      w.className = "wisp " + (Math.random() < .6 ? "blue" : "red");
      w.style.cssText =
        `left:${Math.random()*100}%;top:${60+Math.random()*38}%;width:${size}px;height:${size}px;` +
        `--dx:${(Math.random()*80-40).toFixed(0)}px;` +
        `animation-duration:${9+Math.random()*10}s;animation-delay:${Math.random()*12}s`;
      bg.appendChild(w);
    }

    const input = document.getElementById("code");
    const msg = document.getElementById("msg");
    const lock = document.getElementById("lock");

    function tryCode() {
      const v = input.value.replace(/\s/g, "");
      if (v === CODE) {
        lock.style.display = "none";
        document.getElementById("prize").classList.add("show");
        input.blur();
      } else {
        msg.textContent = "Portti pysyy suljettuna. Yritä uudelleen.";
        lock.classList.remove("shake");
        void lock.offsetWidth;
        lock.classList.add("shake");
        input.select();
      }
    }
    document.getElementById("go").addEventListener("click", tryCode);
    input.addEventListener("keydown", e => { if (e.key === "Enter") tryCode(); });
  </script>
</body>
</html>
